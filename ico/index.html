<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <title>Ge3 Icon Manager</title>
    <script type="module" src='ge-icon.js'></script>
    <script type="module" src='icons.js'></script>
    <script type="module" src='iconman.js'></script>
    <link rel="stylesheet" href="style.css" type="text/css" media="all">
    <link rel="icon" type="image/svg" href="/snara/static/favicon.svg"/>

    <!-- Anti-FART: apply saved theme before paint -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
    </script>
</head>
<body>
    <header>
        <div class="header-content">
		<div class='left'>
            <div class="logo">
                <h1>🪄 Ge3 Icon Manager</h1>
            </div>
            <input type="text" id="search" placeholder="Search icons... (ai, book, trash, etc.)" autocomplete="off">
            <div class="stats">
                <span id="icon-count">0</span> icons
            </div>
		</div><div class='right'>
			<a href='svg.php'>svg rebuild</a>		
			<a target="_blank" href='https://icon-sets.iconify.design/?category=UI+24px&tag=Uses+Stroke'>iconify</a>
			<span></span>
            <button id="theme-toggle" class="theme-btn">☀️</button>
        </div>
	<div>
    </header>

    <main>
        <div id="icon-index"></div>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast">Copied!</div>
</body>
</html>
