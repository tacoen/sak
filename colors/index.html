<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Engine Lab</title>
    <style id="theme-styles">
        :root {
            --bg: #181118;
            --fg: #e7eee7;

            /* Core Backgrounds */
            --bg-subtle:  color-mix(in srgb, var(--bg), white 5%);  
            --bg-inset:   color-mix(in srgb, var(--bg), black 30%); 
            --bg-overlay: color-mix(in srgb, var(--bg), black 15%); 

            /* Core Borders */
            --border-muted: color-mix(in srgb, var(--bg), white 10%); 
            --border:       color-mix(in srgb, var(--bg), white 15%); 
            --border-hover: color-mix(in srgb, var(--bg), white 20%); 

            /* Functional Colors logic */
            --pr: #3b82f6;
            --pr-bg:      color-mix(in srgb, var(--bg), var(--pr) 20%);
            --pr-subtle:  color-mix(in srgb, var(--bg), var(--pr) 10%);
            --pr-border:  color-mix(in srgb, var(--bg), var(--pr) 40%);

            --sc: #22c55e;
            --sc-bg:      color-mix(in srgb, var(--bg), var(--sc) 20%);
            --sc-subtle:  color-mix(in srgb, var(--bg), var(--sc) 10%);
            --sc-border:  color-mix(in srgb, var(--bg), var(--sc) 40%);

            --da: #ef4444;
            --da-bg:       color-mix(in srgb, var(--bg), var(--da) 20%);
            --da-subtle:   color-mix(in srgb, var(--bg), var(--da) 10%);
            --da-border:   color-mix(in srgb, var(--bg), var(--da) 40%);

            --wr: #f59e0b;
            --wr-bg:         color-mix(in srgb, var(--bg), var(--wr) 20%);
            --wr-subtle:     color-mix(in srgb, var(--bg), var(--wr) 10%);
            --wr-border:     color-mix(in srgb, var(--bg), var(--wr) 40%);
        }

        body {
            background-color: var(--bg-inset);
            color: var(--fg);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Layout Panels */
        .preview-panel {
            flex: 0 0 70%;
            background-color: var(--bg);
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .code-panel {
            flex: 0 0 30%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            padding: .5rem;
            box-sizing: border-box;
        }

        .code-panel h3 { 
            margin: 0 0 1rem 0; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            opacity: 0.6; 
            color: white;
        }

        #css-output {
            flex-grow: 1;
            background: #000;
            color: #7ee787;
            border: 1px solid #333;
            border-radius: 6px;
            padding: .5rem;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            width: calc(100% - .5rem);
        }

        /* Controls Area */
        .controls {
            background: var(--bg-overlay);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .histogram, .colorpick {
            display: flex;
            gap: 6px;
            padding: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            align-items: center;
        }

        input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            width: 38px;
            height: 38px;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            outline: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }
        input[type="color"]::-moz-color-swatch { border: none; border-radius: 3px; }

        .histogram span { 
            width: 38px; 
            height: 38px; 
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.08);
            display: inline-block;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--bg-subtle);
            border: 1px solid var(--border-muted);
            padding: 1.5rem;
            border-radius: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
        }

        .card.primary { background: var(--pr-subtle); border-color: var(--pr-border); }
        .card.success { background: var(--sc-subtle); border-color: var(--sc-border); }
        .card.danger  { background: var(--da-subtle); border-color: var(--da-border); }
        .card.warn    { background: var(--wr-subtle); border-color: var(--wr-border); }

        .inset-box {
            background: var(--bg-inset);
            padding: 1rem;
            border-radius: 6px;
            font-family: 'ui-monospace', monospace;
            font-size: 0.8rem;
            margin: 12px 0;
            color: var(--fg);
            opacity: 0.7;
        }

        .btn {
            background: var(--bg-overlay);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
            margin-right: 6px;
            margin-top: 8px;
        }

        .btn.primary { background: var(--pr-bg); border-color: var(--pr-border); }
        .btn.success { background: var(--sc-bg); border-color: var(--sc-border); }
        .btn.danger  { background: var(--da-bg); border-color: var(--da-border); }
        .btn.warn    { background: var(--wr-bg); border-color: var(--wr-border); }

        .btn:hover { 
            filter: brightness(1.2);
            border-color: var(--border-hover);
        }
    </style>
</head>
<body>

    <div class="preview-panel">
        <div class="controls">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <span id="hexValue" style="font-family: monospace; font-size: 0.85rem; font-weight: bold;">#181118</span>
            </div>

            <div class="histogram">
                <span style="background-color: var(--bg-inset)" title="--bg-inset"></span>
                <span style="background-color: var(--bg-overlay)" title="--bg-overlay"></span>
                <input type="color" id="bgPicker" value="#181118" title="--bg">
                <span style="background-color: var(--bg-subtle)" title="--bg-subtle"></span>
                <span style="background-color: var(--border-muted)" title="--border-muted"></span>
                <span style="background-color: var(--border)" title="--border"></span>
                <span style="background-color: var(--border-hover)" title="--border-hover"></span>
            </div>

            <div class="colorpick">
                <input type="color" id="prPicker" value="#3b82f6" title="--pr">
                <input type="color" id="scPicker" value="#22c55e" title="--sc">
                <input type="color" id="daPicker" value="#ef4444" title="--da">
                <input type="color" id="wrPicker" value="#f59e0b" title="--wr">
                <input type="color" id="fgPicker" value="#e7eee7" title="--fg">
            </div>
        </div>

        <div class="preview-grid">
            <div class="card">
                <h3>Subtle Card</h3>
                <p style="font-size: 0.9rem; opacity: 0.7;">Neutral interface element.</p>
                <div class="inset-box">--bg-inset area</div>
                <button class="btn primary">Primary</button>
                <button class="btn success">Success</button>
            </div>

            <div class="card" style="background: var(--bg-overlay)">
                <h3>Overlay Card</h3>
                <p style="font-size: 0.9rem; opacity: 0.7;">Floating or modal-like feel.</p>
                <div class="inset-box">--bg-inset area</div>
                <button class="btn danger">Danger</button>
                <button class="btn warn">Warn</button>
            </div>

            <div class="card primary">
                <h3>Primary Action</h3>
                <div class="inset-box" style="background: var(--pr-bg)">--pr-bg</div>
                <button class="btn" style="border-color: var(--pr-border)">Action</button>
            </div>

            <div class="card success">
                <h3>Success State</h3>
                <div class="inset-box" style="background: var(--sc-bg)">--sc-bg</div>
                <button class="btn" style="border-color: var(--sc-border)">Action</button>
            </div>

            <div class="card danger">
                <h3>Danger State</h3>
                <div class="inset-box" style="background: var(--da-bg)">--da-bg</div>
                <button class="btn" style="border-color: var(--da-border)">Action</button>
            </div>

            <div class="card warn">
                <h3>Warning State</h3>
                <div class="inset-box" style="background: var(--wr-bg)">--wr-bg</div>
                <button class="btn" style="border-color: var(--wr-border)">Action</button>
            </div>
        </div>
    </div>

    <div class="code-panel">
        <h3>CSS :root Export</h3>
        <textarea id="css-output" spellcheck="false" readonly></textarea>
    </div>

    <script>
        const root = document.documentElement;
        const cssOutput = document.getElementById('css-output');
        const hexText = document.getElementById('hexValue');
        const fgPicker = document.getElementById('fgPicker');

        const state = {
            '--bg': '#181118',
            '--fg': '#e7eee7',
            '--pr': '#3b82f6',
            '--sc': '#22c55e',
            '--da': '#ef4444',
            '--wr': '#f59e0b'
        };

        const invertHex = (hex) => {
            if (hex.indexOf('#') === 0) hex = hex.slice(1);
            if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            const r = (255 - parseInt(hex.slice(0, 2), 16)).toString(16).padStart(2, '0');
            const g = (255 - parseInt(hex.slice(2, 4), 16)).toString(16).padStart(2, '0');
            const b = (255 - parseInt(hex.slice(4, 6), 16)).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        };

        const updateCSSExport = () => {
            const cssString = `:root {
  --bg: ${state['--bg']};
  --fg: ${state['--fg']};
  --pr: ${state['--pr']};
  --sc: ${state['--sc']};
  --da: ${state['--da']};
  --wr: ${state['--wr']};

  /* Functional logic */
  --bg-subtle: color-mix(in srgb, var(--bg), white 5%);
  --bg-inset: color-mix(in srgb, var(--bg), black 30%);
  --bg-overlay: color-mix(in srgb, var(--bg), black 15%);
  --border-muted: color-mix(in srgb, var(--bg), white 10%);
  --border: color-mix(in srgb, var(--bg), white 15%);
  --border-hover: color-mix(in srgb, var(--bg), white 20%);
  --pr-bg: color-mix(in srgb, var(--bg), var(--pr) 20%);
  --pr-subtle: color-mix(in srgb, var(--bg), var(--pr) 10%);
  --pr-border: color-mix(in srgb, var(--bg), var(--pr) 40%);
  --sc-bg: color-mix(in srgb, var(--bg), var(--sc) 20%);
  --sc-subtle: color-mix(in srgb, var(--bg), var(--sc) 10%);
  --sc-border: color-mix(in srgb, var(--bg), var(--sc) 40%);
  --da-bg: color-mix(in srgb, var(--bg), var(--da) 20%);
  --da-subtle: color-mix(in srgb, var(--bg), var(--da) 10%);
  --da-border: color-mix(in srgb, var(--bg), var(--da) 40%);
  --wr-bg: color-mix(in srgb, var(--bg), var(--wr) 20%);
  --wr-subtle: color-mix(in srgb, var(--bg), var(--wr) 10%);
  --wr-border: color-mix(in srgb, var(--bg), var(--wr) 40%);
}`;
            cssOutput.value = cssString;
        };

        const initPicker = (id, variable, labelEl = null) => {
            const picker = document.getElementById(id);
            picker.value = state[variable];

            picker.addEventListener('input', (e) => {
                const newVal = e.target.value;
                state[variable] = newVal;
                root.style.setProperty(variable, newVal);
                
                if (labelEl) labelEl.textContent = newVal.toUpperCase();

                if (variable === '--bg') {
                    const invertedColor = invertHex(newVal);
                    state['--fg'] = invertedColor;
                    root.style.setProperty('--fg', invertedColor);
                    fgPicker.value = invertedColor;
                }
                
                updateCSSExport();
            });
        };

        document.addEventListener('DOMContentLoaded', () => {
            initPicker('bgPicker', '--bg', hexText);
            initPicker('fgPicker', '--fg');
            initPicker('prPicker', '--pr');
            initPicker('scPicker', '--sc');
            initPicker('daPicker', '--da');
            initPicker('wrPicker', '--wr');
            updateCSSExport();
        });
    </script>
</body>
</html>
