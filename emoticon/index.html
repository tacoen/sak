<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Emoticon Library</title>
    <style>
        :root {
            --bg: #111111;
            --sidebar-bg: #1a1a1a;
            --card-bg: #222222;
            --text: #e7eee7;
            --primary: #3b82f6;
            --accent: #ef4444;
            --border: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - Favorites */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 1.5rem;
            background: #000;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        #favorites-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            margin: 0;
            list-style: none;
        }

        .fav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: var(--card-bg);
            border-radius: 8px;
            font-size: 1.5rem;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .remove-btn {
            cursor: pointer;
            border: none;
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .category-section {
            margin-bottom: 3rem;
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: -2rem;
            background: var(--bg);
            z-index: 5;
        }

        .emoticon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.75rem;
        }

        .emoticon-card {
            background: var(--card-bg);
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .emoticon-card:hover {
            border-color: var(--primary);
            transform: scale(1.05);
            background: #2a2a2a;
        }

        .emoji-display {
            font-size: 2rem;
            display: block;
        }

        /* Hide actual checkbox, use the card as the toggle */
        .fav-checkbox {
            position: absolute;
            top: 5px;
            right: 5px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .card-active {
            border-color: var(--primary) !important;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .empty-msg {
            color: #666;
            text-align: center;
            margin-top: 2rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <span>⭐ MY FAVORITES</span>
            <span id="fav-count" style="font-size: 0.8rem; background: var(--primary); padding: 2px 8px; border-radius: 10px;">0</span>
        </div>
        <ul id="favorites-list"></ul>
    </aside>

    <main class="main-content">
        <h1 style="margin-top:0">Emoticon Database</h1>
        <div id="emoticon-container"></div>
    </main>

    <script src="emoticons.js"></script>

    <script>
        const favListUI = document.getElementById('favorites-list');
        const containerUI = document.getElementById('emoticon-container');
        const countUI = document.getElementById('fav-count');

        let favorites = JSON.parse(localStorage.getItem('favEmoticons')) || [];

        function init() {
            renderMainList();
            renderFavorites();
        }

        function renderMainList() {
            containerUI.innerHTML = '';
            for (const [category, items] of Object.entries(emoticonsData)) {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const gridHtml = items.map(emoji => {
                    const isFav = favorites.includes(emoji);
                    return `
                        <div class="emoticon-card ${isFav ? 'card-active' : ''}" onclick="toggleFavorite('${emoji}')">
                            <span class="emoji-display">${emoji}</span>
                            <input type="checkbox" class="fav-checkbox" ${isFav ? 'checked' : ''} onclick="event.stopPropagation()">
                        </div>
                    `;
                }).join('');

                section.innerHTML = `
                    <div class="category-title">${category}</div>
                    <div class="emoticon-grid">${gridHtml}</div>
                `;
                containerUI.appendChild(section);
            }
        }

        function toggleFavorite(emoji) {
            if (favorites.includes(emoji)) {
                favorites = favorites.filter(f => f !== emoji);
            } else {
                favorites.push(emoji);
            }
            save();
        }

        function save() {
            localStorage.setItem('favEmoticons', JSON.stringify(favorites));
            countUI.textContent = favorites.length;
            renderMainList();
            renderFavorites();
        }

        function renderFavorites() {
            favListUI.innerHTML = '';
            countUI.textContent = favorites.length;

            if (favorites.length === 0) {
                favListUI.innerHTML = '<li class="empty-msg">Select emojis to add them here</li>';
                return;
            }

            favorites.forEach(emoji => {
                const li = document.createElement('li');
                li.className = 'fav-item';
                li.innerHTML = `
                    <span>${emoji}</span>
                    <button class="remove-btn" onclick="toggleFavorite('${emoji}')">REMOVE</button>
                `;
                favListUI.appendChild(li);
            });
        }

        init();
    </script>
</body>
</html>
