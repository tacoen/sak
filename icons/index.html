<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon Catalog</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        color: #222;
        padding: 32px 24px;
      }

      /* ── Header ── */
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      header .titles {
        flex: 1;
      }
      header h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #111;
      }
      header p {
        margin-top: 4px;
        font-size: 0.8rem;
        color: #888;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 7px;
        border: none;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        opacity: 0.82;
      }
      .btn-primary {
        background: #111;
        color: #fff;
      }
      .btn-ghost {
        background: #e8e8e8;
        color: #333;
      }
      .btn-danger {
        background: #fee2e2;
        color: #b91c1c;
      }
      .btn-export {
        background: #dbeafe;
        color: #1d4ed8;
      }

      /* ── Grid ── */
      .grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
      }

      /* ── Card ── */
      .card {
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 8px;
        padding: 14px 8px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        position: relative;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .card:hover {
        border-color: #bbb;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      }

      .card .icon-wrap svg {
        display: block;
        color: #333;
      }
      .card .name {
        font-size: 0.62rem;
        color: #888;
        text-align: center;
        word-break: break-all;
        line-height: 1.3;
        cursor: pointer;
      }
      .card .name:hover {
        color: #111;
      }

      /* card action buttons (edit / delete) */
      .card-actions {
        display: none;
        position: absolute;
        top: 5px;
        right: 5px;
        gap: 3px;
      }
      .card:hover .card-actions {
        display: flex;
      }

      .edit-btn,
      .del-btn {
        background: #f0f0f0;
        border: none;
        border-radius: 4px;
        padding: 2px 5px;
        cursor: pointer;
        font-size: 10px;
        line-height: 1.4;
        color: #555;
      }
      .edit-btn:hover {
        background: #ddd;
      }
      .del-btn:hover {
        background: #fecaca;
        color: #b91c1c;
      }

      /* copy flash */
      .card.copied::after {
        content: "copied!";
        position: absolute;
        top: 6px;
        left: 6px;
        font-size: 0.55rem;
        background: #222;
        color: #fff;
        border-radius: 4px;
        padding: 2px 5px;
        pointer-events: none;
      }

      /* add card */
      .card-add {
        background: #fff;
        border: 2px dashed #d0d0d0;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        min-height: 88px;
        color: #bbb;
        font-size: 0.68rem;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
      }
      .card-add:hover {
        border-color: #888;
        color: #555;
        background: #fafafa;
      }

      /* ── Modal ── */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.38);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        background: #fff;
        border-radius: 12px;
        padding: 28px;
        width: min(530px, 94vw);
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .modal h2 {
        font-size: 1rem;
        font-weight: 600;
        color: #111;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label {
        font-size: 0.75rem;
        font-weight: 500;
        color: #555;
      }
      .field small {
        font-size: 0.68rem;
        color: #aaa;
        margin-top: -2px;
      }

      .field input,
      .field textarea {
        border: 1px solid #ddd;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 0.8rem;
        font-family: inherit;
        color: #111;
        background: #fafafa;
        transition: border-color 0.15s;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: #888;
        background: #fff;
      }
      .field textarea {
        min-height: 108px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.71rem;
        line-height: 1.5;
      }

      /* live preview */
      .preview-strip {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #f5f5f5;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .preview-icon {
        color: #333;
        display: flex;
        align-items: center;
        min-width: 32px;
      }
      .preview-hint {
        font-size: 0.72rem;
        color: #999;
      }

      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: repeat(8, 1fr);
        }
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      @media (max-width: 480px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="titles">
        <h1>Icon Catalog</h1>
        <p id="count"></p>
      </div>
      <button
        class="btn btn-ghost"
        id="resetBtn"
        title="Clear saved changes and reload from icons.js"
      >
        ↺ Reset
      </button>
      <button class="btn btn-export" id="exportBtn">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Export icons.js
      </button>
    </header>

    <div class="grid" id="grid"></div>

    <!-- ── Modal ── -->
    <div class="modal-backdrop" id="modalBackdrop">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <h2 id="modalTitle">Edit Icon</h2>

        <div class="field">
          <label for="inputName">Icon Name</label>
          <small>Key used in icons.js — lowercase, hyphens ok</small>
          <input
            type="text"
            id="inputName"
            placeholder="e.g. my-icon"
            spellcheck="false"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="inputSvg">SVG Code</label>
          <small
            >Paste raw SVG — quotes escaped to \" and newlines stripped
            automatically on save</small
          >
          <textarea
            id="inputSvg"
            placeholder='<svg xmlns="http://www.w3.org/2000/svg" …></svg>'
          ></textarea>
        </div>

        <div class="preview-strip">
          <div class="preview-icon" id="previewIcon"></div>
          <span class="preview-hint" id="previewHint"
            >Enter SVG above to preview</span
          >
        </div>

        <div class="modal-actions">
          <button
            class="btn btn-danger"
            id="deleteBtn"
            style="margin-right: auto"
          >
            Delete
          </button>
          <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </div>
    </div>

    <script type="module">
      import icons from "./icons.js";

      /* ── Store: id → svg string with escaped quotes (as in icons.js) ── */
      const store = {};
      let editingId = null; // null = adding new

      /* ─────────────────────────────
     SVG helpers
  ───────────────────────────── */

      /** Escape " → \" so the string is safe inside a JS string literal */
      function escapeSvg(raw) {
        return raw.replace(/"/g, '\\"');
      }

      /** Restore \" → " for textarea display and DOM rendering */
      function unescapeSvg(str) {
        return str.replace(/\\"/g, '"');
      }

      /* ─────────────────────────────
     localStorage persistence
  ───────────────────────────── */
      const LS_KEY = "icon-catalog-store-v2"; // v2: values are \" escaped

      function persist() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(store));
        } catch (_) {}
      }

      function loadPersisted() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return false;
          const saved = JSON.parse(raw);
          Object.assign(store, saved);
          return true;
        } catch (_) {
          return false;
        }
      }

      /**
       * Render an SVG string into `el` at a given size.
       * Accepts both raw (unescaped) and escaped strings.
       * Returns true if a valid <svg> was found.
       */
      function renderIcon(svgStr, el, size = 28) {
        const raw = unescapeSvg(svgStr);
        const wrap = document.createElement("div");
        wrap.innerHTML = raw;
        const svg = wrap.firstElementChild;
        if (svg && svg.tagName.toLowerCase() === "svg") {
          svg.removeAttribute("class");
          svg.setAttribute("width", size);
          svg.setAttribute("height", size);
          el.innerHTML = "";
          el.appendChild(svg);
          return true;
        }
        el.innerHTML = "";
        return false;
      }

      /* ─────────────────────────────
     Count label
  ───────────────────────────── */
      function updateCount() {
        const n = Object.keys(store).length;
        document.getElementById("count").textContent = `${n} icon${
          n !== 1 ? "s" : ""
        } · sorted alphabetically · click name to copy · hover card to edit`;
      }

      /* ─────────────────────────────
     Card factory
  ───────────────────────────── */
      function makeCard(id) {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = id;

        /* action buttons */
        const actions = document.createElement("div");
        actions.className = "card-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "edit-btn";
        editBtn.textContent = "✏️";
        editBtn.title = "Edit icon";
        editBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openModal(id);
        });

        const delBtn = document.createElement("button");
        delBtn.className = "del-btn";
        delBtn.textContent = "🗑";
        delBtn.title = "Delete icon";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (confirm(`Delete icon "${id}"?`)) {
            delete store[id];
            persist();
            renderGrid();
          }
        });

        actions.append(editBtn, delBtn);

        /* icon */
        const iconWrap = document.createElement("div");
        iconWrap.className = "icon-wrap";
        renderIcon(store[id], iconWrap);

        /* name label */
        const label = document.createElement("div");
        label.className = "name";
        label.textContent = id;
        label.title = "Click to copy name";
        label.addEventListener("click", (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(id).catch(() => {});
          card.classList.add("copied");
          setTimeout(() => card.classList.remove("copied"), 1200);
        });

        card.append(actions, iconWrap, label);
        return card;
      }

      /* ─────────────────────────────
     Full grid render (re-sorts)
  ───────────────────────────── */
      function renderGrid() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        Object.keys(store)
          .sort((a, b) => a.localeCompare(b))
          .forEach((id) => grid.appendChild(makeCard(id)));

        /* "+ Add" tile */
        const addTile = document.createElement("div");
        addTile.className = "card-add";
        addTile.title = "Add new icon";
        addTile.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span>Add icon</span>`;
        addTile.addEventListener("click", () => openModal(null));
        grid.appendChild(addTile);

        updateCount();
      }

      /* ─────────────────────────────
     Modal logic
  ───────────────────────────── */
      const backdrop = document.getElementById("modalBackdrop");
      const titleEl = document.getElementById("modalTitle");
      const inputName = document.getElementById("inputName");
      const inputSvg = document.getElementById("inputSvg");
      const previewEl = document.getElementById("previewIcon");
      const hintEl = document.getElementById("previewHint");
      const deleteBtn = document.getElementById("deleteBtn");

      function openModal(id) {
        editingId = id;
        titleEl.textContent = id ? "Edit Icon" : "Add Icon";
        deleteBtn.style.display = id ? "inline-flex" : "none";

        if (id) {
          inputName.value = id;
          // Show escaped SVG in textarea (with \" as stored)
          inputSvg.value = store[id];
          renderIcon(store[id], previewEl);
          hintEl.textContent = "Current icon";
        } else {
          inputName.value = "";
          inputSvg.value = "";
          previewEl.innerHTML = "";
          hintEl.textContent = "Enter SVG above to preview";
        }

        backdrop.classList.add("open");
        setTimeout(() => inputName.focus(), 50);
      }

      function closeModal() {
        backdrop.classList.remove("open");
        editingId = null;
      }

      /* Live SVG preview */
      inputSvg.addEventListener("input", () => {
        const raw = inputSvg.value.trim();
        if (!raw) {
          previewEl.innerHTML = "";
          hintEl.textContent = "Enter SVG above to preview";
          return;
        }
        const ok = renderIcon(raw, previewEl, 32);
        hintEl.textContent = ok ? "Preview ✓" : "⚠️ Invalid or incomplete SVG";
      });

      /* Save */
      document.getElementById("saveBtn").addEventListener("click", () => {
        const newName = inputName.value.trim();
        const rawSvg = inputSvg.value.trim();

        if (!newName) {
          inputName.focus();
          inputName.style.borderColor = "#f87171";
          return;
        }
        if (!rawSvg) {
          inputSvg.focus();
          inputSvg.style.borderColor = "#f87171";
          return;
        }

        inputName.style.borderColor = "";
        inputSvg.style.borderColor = "";

        // Strip newlines, then ensure all " are escaped as \" for JS safety.
        // Unescape first so we never double-escape if user pasted already-escaped SVG.
        const cleanSvg = rawSvg.replace(/[\r\n]+/g, "");
        const safeSvg = escapeSvg(unescapeSvg(cleanSvg));

        // If renaming, delete old key
        if (editingId && editingId !== newName) {
          delete store[editingId];
        }

        store[newName] = safeSvg;
        persist();
        renderGrid();
        closeModal();
      });

      /* Delete */
      deleteBtn.addEventListener("click", () => {
        if (editingId && confirm(`Delete icon "${editingId}"?`)) {
          delete store[editingId];
          persist();
          renderGrid();
          closeModal();
        }
      });

      /* Close */
      document
        .getElementById("cancelBtn")
        .addEventListener("click", closeModal);
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      /* ─────────────────────────────
     Export icons.js
  ───────────────────────────── */
      document.getElementById("resetBtn").addEventListener("click", () => {
        if (confirm("Reset to original icons.js? All edits will be lost.")) {
          localStorage.removeItem(LS_KEY);
          location.reload();
        }
      });

      document.getElementById("exportBtn").addEventListener("click", () => {
        const sorted = Object.keys(store).sort((a, b) => a.localeCompare(b));

        // Each value already has escaped quotes — wrap in double-quotes as-is
        const lines = sorted.map((id) => ` "${id}": "${store[id]}"`);
        const output = `const icons = {\n${lines.join(
          ",\n"
        )}\n};\n\nexport default icons;\n`;

        const blob = new Blob([output], { type: "text/javascript" });
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement("a"), {
          href: url,
          download: "icons.js",
        });
        a.click();
        URL.revokeObjectURL(url);
      });

      /* ─────────────────────────────
     Boot — prefer localStorage, fall back to icons.js
  ───────────────────────────── */
      const hadSaved = loadPersisted();

      if (!hadSaved) {
        // First load — seed from the imported module.
        // Imported JS strings have real " chars; escape them to \" for storage.
        for (const [id, svg] of Object.entries(icons)) {
          if (id === "blank") continue;
          store[id] = escapeSvg(svg);
        }
        persist();
      }

      renderGrid();
    </script>
  </body>
</html>
